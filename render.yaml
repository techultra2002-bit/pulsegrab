services:
  - type: web
    name: pulsegrab-ecosystem
    env: node
    plan: free
    rootDir: website 2.0
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: YOUTUBE_DL_SKIP_PYTHON_CHECK
        value: "1"
      - key: PORT
        value: "3000"
